<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>七段数码管数字显示</title>
    <style>
        * {
            margin: 20px auto;
            text-align: center;
            font-family: system-ui;
        }
        /* 数码管容器 */
        .display {
            width: 200px;
            height: 300px;
            position: relative;
        }
        /* 7段基础样式 */
        .segment {
            position: absolute;
            background-color: #ccc;
            transition: all 0.2s;
        }
        /* 亮灯状态 */
        .segment.active {
            background-color: #ff3333;
            box-shadow: 0 0 10px #ff3333;
        }
        /* 各段位置尺寸 */
        .seg-a {width:100px;height:20px;top:0;left:50px;border-radius:10px;}
        .seg-b {width:20px;height:100px;top:30px;left:130px;border-radius:10px;}
        .seg-c {width:20px;height:100px;top:170px;left:130px;border-radius:10px;}
        .seg-d {width:100px;height:20px;top:270px;left:50px;border-radius:10px;}
        .seg-e {width:20px;height:100px;top:170px;left:30px;border-radius:10px;}
        .seg-f {width:20px;height:100px;top:30px;left:30px;border-radius:10px;}
        .seg-g {width:100px;height:20px;top:150px;left:50px;border-radius:10px;}

        /* 按钮样式 */
        .num-btn {
            width: 60px;
            height: 60px;
            font-size:24px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #f5f5f5;
        }
        .num-btn:hover{background: #eee;}
    </style>
</head>
<body>
    <h1>七段数码管数字显示器</h1>
    <!-- 数码管区域 -->
    <div class="display">
        <div class="segment seg-a"></div>
        <div class="segment seg-b"></div>
        <div class="segment seg-c"></div>
        <div class="segment seg-d"></div>
        <div class="segment seg-e"></div>
        <div class="segment seg-f"></div>
        <div class="segment seg-g"></div>
    </div>
    <!-- 数字按钮区 -->
    <div class="btn-group">
        <button class="num-btn" onclick="showNum(0)">0</button>
        <button class="num-btn" onclick="showNum(1)">1</button>
        <button class="num-btn" onclick="showNum(2)">2</button>
        <button class="num-btn" onclick="showNum(3)">3</button>
        <button class="num-btn" onclick="showNum(4)">4</button>
        <br>
        <button class="num-btn" onclick="showNum(5)">5</button>
        <button class="num-btn" onclick="showNum(6)">6</button>
        <button class="num-btn" onclick="showNum(7)">7</button>
        <button class="num-btn" onclick="showNum(8)">8</button>
        <button class="num-btn" onclick="showNum(9)">9</button>
    </div>

<script>
    // 0-9数字对应的段码映射表，active为需要点亮的段
    const numMap = {
        0: ['a','b','c','d','e','f'],
        1: ['b','c'],
        2: ['a','b','g','e','d'],
        3: ['a','b','g','c','d'],
        4: ['f','g','b','c'],
        5: ['a','f','g','c','d'],
        6: ['a','f','g','c','d','e'],
        7: ['a','b','c'],
        8: ['a','b','c','d','e','f','g'],
        9: ['a','b','c','d','f','g']
    }

    function showNum(num){
        // 先关闭所有段
        document.querySelectorAll('.segment').forEach(seg=>seg.classList.remove('active'))
        // 点亮对应数字的段
        numMap[num].forEach(segName=>{
            document.querySelector(`.seg-${segName}`).classList.add('active')
        })
    }
</script>
</body>
</html>
